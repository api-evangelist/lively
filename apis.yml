aid: lively
name: Lively
description: >-
  Lively is a fintech-healthtech company that provides modern, cloud-based Health
  Savings Accounts (HSA) alongside Flexible Spending Accounts (FSA), Health
  Reimbursement Arrangements (HRA), COBRA, and commuter benefits for individuals,
  families, employers, benefits administrators, and third-party administrators.
  Lively pairs interest-bearing and investment-enabled HSAs (via a Schwab Health
  Savings Brokerage Account and a guided HSA portfolio) with an employer dashboard
  for contributions and administration, positioning itself around transparent,
  zero-hidden-fee pricing. Backed by Costanoa Ventures and GGV Capital, Lively
  integrates with benefit administration platforms and third-party administrators
  but does not currently publish a public developer API or developer portal;
  integration is handled through its sales and partnerships channels. This profile
  was surfaced as a VC-portfolio lead and enriched by the API Evangelist pipeline
  from Lively's public web surface.
